name: Build and Test PR

permissions:
    actions: write # Required for cancel-in-progress concurrency
    contents: read

on:
    pull_request:
        types: [opened, synchronize, labeled]
        branches:
            - '**'

concurrency:
    group: cloudflare-pages-build-${{ github.head_ref }}
    cancel-in-progress: true

jobs:
    build_and_test:
        # For same-repo PRs (org members), always run.
        # For fork PRs, only run after a maintainer adds the 'safe to test' label.
        if: |
            github.event.pull_request.head.repo.full_name == github.repository ||
            contains(github.event.pull_request.labels.*.name, 'safe to test')
        timeout-minutes: 30
        runs-on: ubuntu-latest
        steps:
            - name: Checkout to branch
              uses: actions/checkout@v4

            - name: Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x
                  cache: 'npm'

            - name: Create npmrc file
              shell: bash
              run: echo "@deriv-com:registry=https://npm.pkg.github.com" >> .npmrc

            - name: Get cached dependencies
              id: cache-npm
              uses: actions/cache@v4
              with:
                  path: node_modules
                  key: npm-${{ hashFiles('./package-lock.json') }}

            - name: Install dependencies
              if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}
              run: npm ci
              shell: bash

            - name: Build staging
              run: npm run build
              env:
                VITE_PROJECT_NAME: ${{ vars.VITE_PROJECT_NAME }}
                VITE_CROWDIN_BRANCH_NAME: ${{ vars.VITE_CROWDIN_BRANCH_NAME }}
                VITE_TRANSLATIONS_CDN_URL: ${{ vars.VITE_TRANSLATIONS_CDN_URL }}
                VITE_GROWTHBOOK_DECRYPTION_KEY: ${{ secrets.VITE_GROWTHBOOK_DECRYPTION_KEY }}
                VITE_GROWTHBOOK_CLIENT_KEY: ${{ vars.VITE_GROWTHBOOK_CLIENT_KEY }}
                VITE_RUDDERSTACK_KEY: ${{ vars.VITE_RUDDERSTACK_KEY }}
                VITE_REMOTE_CONFIG_URL: ${{ vars.VITE_REMOTE_CONFIG_URL }}

            - name: Run tests for Eslint
              run: npm run test:lint

            - name: Save PR metadata
              run: |
                  echo "${{ github.event.pull_request.number }}" > pr_number.txt
                  echo "${{ github.head_ref }}" > pr_head_ref.txt

            - name: Upload build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: build-dist
                  path: dist/
                  retention-days: 1

            - name: Upload PR metadata
              uses: actions/upload-artifact@v4
              with:
                  name: pr-metadata
                  path: |
                      pr_number.txt
                      pr_head_ref.txt
                  retention-days: 1
